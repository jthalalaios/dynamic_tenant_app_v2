services:
  nodejs-app:
    build:
      context: .
      dockerfile: ./configuration/app_conf/Dockerfile
    # Also used by the realtime service, so the image is built once (no parallel npm installs)
    image: nodejs-react-app:local
    # Local image: always build it (cached), never look for it on a registry
    pull_policy: build
    container_name: nodejs-app
    working_dir: /app
    restart: unless-stopped
    init: true
    # Shared with the realtime service, which boots the same Node.js app
    environment: &node-env
      - APP_URL=${APP_URL:-http://localhost:8081}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5273}
      # Optional standalone theme frontends (see the `standalone` profile below)
      - FRONTEND_URL_DOCTOR=${FRONTEND_URL_DOCTOR:-}
      - FRONTEND_URL_MARKETPLACE=${FRONTEND_URL_MARKETPLACE:-}
      - DB_HOST=${POSTGRES_DB_HOST}
      - DB_PORT=${POSTGRES_DB_PORT}
      - DB_DATABASE=${POSTGRES_DB_DATABASE}
      - DB_USERNAME=${POSTGRES_DB_USERNAME}
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      # Themes this backend serves, empty = all (e.g. "doctor" for a clinic-only deployment)
      - TENANCY_THEMES=${TENANCY_THEMES:-}
      - AUTH_VERIFY_EMAIL=${AUTH_VERIFY_EMAIL:-true}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      # ACL cache, rate limits and realtime fan-out all live in Redis
      - CACHE_STORE=redis
      # Realtime (live chat): the API publishes events through Redis; the realtime
      # container delivers them to browsers, which reach it through nginx (/socket.io/*)
      - BROADCAST_CONNECTION=redis
      - REALTIME_PORT=6001
      - REALTIME_ALLOWED_ORIGINS=${REALTIME_ALLOWED_ORIGINS:-*}
      # nginx is the only proxy in front of the API: trust its X-Forwarded-For
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-loopback,uniquelocal}
    volumes: &node-volumes
      - ./nodejs-app:/app
      # The image's dependencies; a host node_modules (other OS / Node version) never leaks in
      - nodejs-app-node-modules:/app/node_modules
    networks:
      - nodejs-react-app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis-alpine:
        condition: service_healthy
      mailpit:
        condition: service_started
    # entrypoint.sh starts the HTTP server only after the migrations succeeded,
    # so "healthy" means the schema is up to date and requests can be served
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/up').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  # Socket.IO websocket server (live chat). Same image, code and env as nodejs-app;
  # started after it is healthy, so node_modules is installed and migrations have run.
  # It authorises channels and relays events: publishing happens in nodejs-app (via Redis).
  realtime:
    image: nodejs-react-app:local
    pull_policy: never
    container_name: nodejs-realtime
    working_dir: /app
    restart: unless-stopped
    init: true
    command: ["realtime"]
    environment: *node-env
    volumes: *node-volumes
    networks:
      - nodejs-react-app-network
    depends_on:
      nodejs-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6001/up').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  react-frontend:
    build:
      context: .
      dockerfile: ./configuration/frontend_conf/Dockerfile
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8081/api}
      - VITE_PORT=${VITE_PORT}
      # Multi-theme app; set e.g. "doctor,marketplace" to limit the picker
      - VITE_APP_THEMES=${VITE_APP_THEMES:-}
      # Optional: serve separated apps by hostname from this one server
      - VITE_THEME_HOSTS=${VITE_THEME_HOSTS:-}
      # Websocket (Socket.IO, proxied by nginx)
      - VITE_REALTIME_URL=${REALTIME_PUBLIC_URL:-http://localhost:8081}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./react-frontend:/app
      - react-frontend-node-modules:/app/node_modules
    networks:
      - nodejs-react-app-network

  # Standalone theme apps sharing the same API: `docker compose --profile standalone up`
  react-doctor:
    profiles: ["standalone"]
    build:
      context: .
      dockerfile: ./configuration/frontend_conf/Dockerfile
    container_name: react-doctor
    restart: unless-stopped
    ports:
      - "${VITE_DOCTOR_PORT:-5274}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8081/api}
      - VITE_PORT=5173
      - VITE_APP_THEME=doctor
      - VITE_REALTIME_URL=${REALTIME_PUBLIC_URL:-http://localhost:8081}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./react-frontend:/app
      - react-doctor-node-modules:/app/node_modules
    networks:
      - nodejs-react-app-network

  react-market:
    profiles: ["standalone"]
    build:
      context: .
      dockerfile: ./configuration/frontend_conf/Dockerfile
    container_name: react-market
    restart: unless-stopped
    ports:
      - "${VITE_MARKET_PORT:-5275}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8081/api}
      - VITE_PORT=5173
      - VITE_APP_THEME=marketplace
      - VITE_REALTIME_URL=${REALTIME_PUBLIC_URL:-http://localhost:8081}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./react-frontend:/app
      - react-market-node-modules:/app/node_modules
    networks:
      - nodejs-react-app-network

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: nodejs-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB_DATABASE}
      - POSTGRES_USER=${POSTGRES_DB_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    ports:
      - "${POSTGRES_DB_HOST_PORT}:${POSTGRES_DB_PORT}"
    volumes:
      - ./configuration/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    networks:
      - nodejs-react-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USERNAME} -d ${POSTGRES_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-alpine:
    image: redis:8.10.3-alpine
    container_name: nodejs-redis
    restart: always
    command: redis-server
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    networks:
      - nodejs-react-app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mail catcher: every email the API sends (verification, password reset,
  # both themes) lands in the inbox at http://localhost:${MAILPIT_UI_PORT:-8025}.
  # nodejs-app/.env points at it with MAIL_MAILER=smtp, MAIL_HOST=mailpit, MAIL_PORT=1025;
  # put real SMTP settings there instead to deliver to real inboxes.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: nodejs-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - nodejs-react-app-network

  nginx:
    image: nginx:1.31.8-alpine
    container_name: nodejs-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_HOST_PORT}:${HTTP_PORT}"
    volumes:
      - ./configuration/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nodejs-app:
        condition: service_healthy
      # Proxies websockets to it (resolved per request, so nginx survives realtime restarts)
      realtime:
        condition: service_started
    networks:
      - nodejs-react-app-network

# Every name is distinct from the Laravel stack's, so both stacks can run side by side
volumes:
  nodejs-app-node-modules:
    name: nodejs-app-node-modules
  # One per frontend container so parallel `npm install` runs never share a tree
  react-frontend-node-modules:
    name: react-frontend-node-modules
  react-doctor-node-modules:
    name: react-doctor-node-modules
  react-market-node-modules:
    name: react-market-node-modules
  postgres-data:
    name: nodejs-react-postgres-data
  redis-data:
    name: nodejs-react-redis-data

networks:
  nodejs-react-app-network:
    driver: bridge
