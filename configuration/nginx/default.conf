# Websocket upgrade header for proxied Socket.IO connections (this file is included in `http {}`)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Upstreams are resolved per request through Docker's DNS, so nginx starts (and keeps
    # running) even while a container is down or restarting
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    # Socket.IO (live chat): browsers open ws://<host>:<HTTP_HOST_PORT>/socket.io/.
    # ^~ keeps the catch-all location below from matching these paths. The API itself
    # publishes through Redis, so the realtime server exposes nothing else.
    location ^~ /socket.io/ {
        set $realtime_upstream http://realtime:6001;

        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than Socket.IO's ping interval (25s) + timeout (20s), so idle sockets are not cut
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The Node.js API (plus /up, and /dev/mail in local development)
    location / {
        set $api_upstream http://nodejs-app:3000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
